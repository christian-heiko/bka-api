name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Guzzle ${{ matrix.guzzle }} ${{ matrix.dependencies }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4', '8.5' ]
        guzzle: [ '^7.9', '^8.0' ]
        dependencies: [ 'highest' ]
        include:
          # Prove the declared floor of each constraint actually resolves and passes.
          - php: '8.4'
            guzzle: '^7.9'
            dependencies: 'lowest'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: error_reporting=E_ALL

      - name: Pin Guzzle for this job
        run: composer require --no-update "guzzlehttp/guzzle:${{ matrix.guzzle }}"

      - name: Install dependencies
        run: |
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            composer update --prefer-lowest --no-interaction --no-progress
          else
            composer update --no-interaction --no-progress
          fi

      - name: Show resolved versions
        run: composer show guzzlehttp/guzzle | head -3

      - name: Tests
        run: composer test

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --no-progress

      - name: PHPStan
        run: composer stan
